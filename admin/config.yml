backend:
  name: git-gateway
  branch: main

media_folder: ""
public_folder: "/"

locale: "tr"

collections:
  - name: "arac_listesi"
    label: "Araçlar"
    files:
      - name: "araclar"
        label: "Tüm Araçlar"
        file: "araclar.json"
        description: "Buradan araç ekle, sil veya düzenle. Değişiklik kaydedince site otomatik güncellenir."
        fields:
          - name: "araclar"
            label: "Araçlar"
            label_singular: "Araç"
            widget: "list"
            summary: "{{fields.marka}} {{fields.model}} — {{fields.fiyat}}"
            fields:
              - { label: "ID (benzersiz, boşluksuz)", name: "id", widget: "string", hint: "Örn: bmw_320i_2022 — her araçta farklı olmalı" }
              - { label: "Marka", name: "marka", widget: "string", hint: "Örn: BMW" }
              - { label: "Model / Başlık", name: "model", widget: "string", hint: "Örn: 2022 320i Sport Line" }
              - { label: "Fiyat (yazı)", name: "fiyat", widget: "string", hint: "Örn: 1.850.000 TL" }
              - { label: "Fiyat (sadece rakam)", name: "fiyatNum", widget: "number", hint: "Örn: 1850000 — sıralama için, nokta/TL yok" }
              - { label: "Kilometre (sadece rakam)", name: "km", widget: "string", hint: "Örn: 45000" }
              - { label: "Yıl", name: "yil", widget: "string", hint: "Örn: 2022" }
              - label: "Marka Filtresi"
                name: "marka_filtre"
                widget: "select"
                options: ["Audi","BMW","Mercedes","Porsche","Mini","Honda","Opel","Suzuki","Volkswagen","Diğer"]
                hint: "Filtrede hangi marka altında çıksın"
              - label: "Araç Tipi"
                name: "tip"
                widget: "select"
                options: ["Sedan / Hatchback", "SUV / Crossover"]
              - label: "Teknik Özellikler"
                name: "specs"
                widget: "object"
                fields:
                  - { label: "Yıl", name: "Yıl", widget: "string", required: false }
                  - { label: "KM", name: "KM", widget: "string", required: false, hint: "Örn: 45.000" }
                  - { label: "Yakıt", name: "Yakıt", widget: "string", required: false }
                  - { label: "Vites", name: "Vites", widget: "string", required: false }
                  - { label: "Renk", name: "Renk", widget: "string", required: false }
                  - { label: "Motor", name: "Motor", widget: "string", required: false }
                  - { label: "Kasa", name: "Kasa", widget: "string", required: false }
                  - { label: "Çekiş", name: "Çekiş", widget: "string", required: false }
              - { label: "Sahibinden Linki", name: "sahibinden", widget: "string", required: false }
              - { label: "Fotoğraf", name: "foto", widget: "image", required: false, hint: "Bilgisayardan fotoğraf seç, otomatik yüklenir" }
              - { label: "Detaylı Açıklama", name: "aciklama", widget: "text", required: false }
